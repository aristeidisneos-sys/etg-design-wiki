site_name: ETG Design × AI Wiki
site_description: Agentic workflows for design with Figma and Claude
# TODO: replace with https://<org>.github.io/<repo>/
site_url: https://example.github.io/etg-design-wiki/
# repo_url: https://github.com/<org>/<repo>

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/etg.css

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist: { custom_checkbox: true }

nav:
  - Home: index.md
  - Get started:
      - 00 · Start here: 00-start-here.md
      - 01 · Prompting & context: 01-prompting-and-context.md
  - Design system:
      - 02 · Design system hygiene: 02-design-system-hygiene.md
      - 03 · Code Connect: 03-code-connect.md
  - Workflows:
      - 04 · Brief to Figma: 04-brief-to-figma.md
      - 05 · Components from a draft: 05-components-from-draft.md
      - 06 · Tidy up: 06-tidy-up.md
  - Reference:
      - 07 · Pitfalls & verification: 07-pitfalls-and-verification.md
      - Page registry: registry/page-registry.md
