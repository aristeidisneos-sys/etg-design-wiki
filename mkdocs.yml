site_name: ETG Design × AI Wiki
site_description: Agentic workflows for design with Figma and Claude
site_url: https://aristeidisneos-sys.github.io/etg-design-wiki/
repo_url: https://github.com/aristeidisneos-sys/etg-design-wiki

theme:
  name: material
  font:
    text: Instrument Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/etg.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist: { custom_checkbox: true }

nav:
  - Home: index.md
  - Get started:
      - 00 · Start here: 00-start-here.md
      - 01 · How agents work: 01-how-agents-work.md
      - 02 · Prompting & context: 02-prompting-and-context.md
  - Design system:
      - 03 · Design system hygiene: 03-design-system-hygiene.md
      - 04 · Code Connect: 04-code-connect.md
  - Workflows:
      - 05 · Brief to Figma: 05-brief-to-figma.md
      - 06 · Components from a draft: 06-components-from-draft.md
      - 07 · Tidy up: 07-tidy-up.md
  - Governance:
      - 09 · AI & skills governance: 09-governance.md
      - Skill submission template: registry/skill-submission-template.md
  - Reference:
      - 08 · Pitfalls & verification: 08-pitfalls-and-verification.md
      - Page registry: registry/page-registry.md
